# Version of Docker compose file
version: "3.6"

# Apps
services:

  # Download client
  transmission:
    image: linuxserver/transmission
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=lobohastamorir #optional
      - PASS=huevos1 #optional
    volumes:
      - ${USERDIR}/transmission:/config
      - ${DOWNLOADDIR}:/downloads
      - ${DOWNLOADDIR}/watch:/watch
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped

  # Torrent provider
  jackett:
    image: linuxserver/jackett
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=true #optional
    volumes:
      - ${USERDIR}/jackett:/config
      - ${DOWNLOADDIR}:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped
