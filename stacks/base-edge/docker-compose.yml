services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "81:80"
      - "443:443"
      - "81:81"  # Admin UI SOLO local (usa Tailscale/SSH para entrar)
    volumes:
      - /home/estejuan/infra/data/npm:/data
      - /home/estejuan/infra/data/npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    networks:
      - proxy-net

  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    restart: unless-stopped
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
