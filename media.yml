# Version of Docker compose file
version: "3"

# Apps
services:
  # Media request
  overseerr:
    image: linuxserver/overseerr
    container_name: overseerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/overseerr:/config/
    ports:
      - 5055:5055

  # Media management
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/sonarr:/config
      - ${MEDIADIR}/series:/media/series
      - ${DOWNLOADDIR}:/media/downloads
    ports:
      - 8989:8989
    network_mode: bridge
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/radarr:/config
      - ${MEDIADIR}/movies:/media/movies #optional
      - ${DOWNLOADDIR}:/media/downloads #optional
    ports:
      - 7878:7878
    network_mode: bridge
  lidarr:
    image: linuxserver/lidarr
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/lidarr:/config
      - ${MEDIADIR}/music:/media/music
      - ${DOWNLOADDIR}:/media/downloads
    ports:
      - 8686:8686
    network_mode: bridge
  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/bazarr:/config
      - ${MEDIADIR}/movies:/media/movies #optional
      - ${MEDIADIR}/series:/media/series #optional
    ports:
      - 6767:6767
    network_mode: bridge

  # Media Viewing
  plex:
    image: linuxserver/plex
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
      - PLEX_CLAIM=claim-fEN1RgqeP8g8kCMQzvzV
    volumes:
      - ${USERDIR}/plex:/config
      - ${MEDIADIR}:/media
    restart: unless-stopped
    ports:
      - 32400:32400
