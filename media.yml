# Version of Docker compose file
version: "3"

# Apps
services:
  # Media request
  overseerr:
    image: linuxserver/overseerr
    container_name: overseerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/overseerr:/config/
    ports:
      - 5055:5055

  # Media management
  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:s6
    volumes:
      - ${MEDIADIR}:/srv:rw  # Maps host directory to container directory with read-write access
      - {USERDIR}/filebrowser/filebrowser.db:/database/filebrowser.db:rw  # Persistent storage for database file
      - {USERDIR}/filebrowser/settings.json:/config/settings.json:ro  # Read-only mount for configuration file
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "8080:80"
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/sonarr:/config
      - ${MEDIADIR}/series:/media/series
      - ${DOWNLOADDIR}:/media/downloads
    ports:
      - 8989:8989
    network_mode: bridge
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/radarr:/config
      - ${MEDIADIR}/movies:/media/movies #optional
      - ${DOWNLOADDIR}:/media/downloads #optional
    ports:
      - 7878:7878
    network_mode: bridge
  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/bazarr:/config
      - ${MEDIADIR}/movies:/media/movies #optional
      - ${MEDIADIR}/series:/media/series #optional
    ports:
      - 6767:6767
    network_mode: bridge
  
  #Media Editing
  makemkv:
    image: jlesage/makemkv
    container_name: makemkv
    restart: unless-stopped  # Optional, restarts container on failure
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "5800:5800"  # Maps host port 5800 to container port 5800
    volumes:
      - docker/appdata/makemkv:/config:rw  # Persistent storage for configuration
      - ${DOWNLOADDIR}:/storage:ro  # Read-only access to user storage directory
      - ${MEDIADIR}/MakeMKV/output:/output:rw  # Persistent storage for output files
    devices:
      - /dev/sr0:/dev/sr0  # Pass through the first optical drive
      - /dev/sg2:/dev/sg2

  # Media Viewing
  plex:
    image: linuxserver/plex
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
      - PLEX_CLAIM=claim-fEN1RgqeP8g8kCMQzvzV
    volumes:
      - ${USERDIR}/plex:/config
      - ${MEDIADIR}:/media
    restart: unless-stopped
    ports:
      - 32400:32400

  ersatztv:
    image: 'jasongdove/ersatztv:latest-vaapi'
    container_name: ersatztv
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - '8409:8409'
    volumes:
      - '${USERDIR}/ersatztv:/root/.local/share/ersatztv'
      - '${MEDIADIR}:/media:ro'
    restart: unless-stopped
