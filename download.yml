# Version of Docker compose file
version: "3.6"

# Apps
services:

  # Download client
  transmission:
    image: linuxserver/transmission
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=lobohastamorir #optional
      - PASS=huevos1 #optional
      - TRANSMISSION_WEB_HOME=/combustion-release/
    volumes:
      - ${USERDIR}/transmission:/config
      - ${DOWNLOADDIR}:/downloads
      - ${DOWNLOADDIR}/watch:/watch
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    
  jdownloader-2:
    image: jlesage/jdownloader-2
    ports:
      - "5800:5800"
    volumes:
      - ${USERDIR}/jdownloader-2:/config:rw
      - ${DOWNLOADDIR}/jdownloader:/output:rw
    restart: unless-stopped

  # Torrent provider
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PUID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/prowlarr/data:/config
    ports:
      - 9696:9696
    restart: unless-stopped
