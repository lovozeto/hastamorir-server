# Version of Docker compose file
version: "3"

# Apps
services:
  homebridge:
    image: homebridge/homebridge:latest
    restart: always
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/homebridge:/homebridge
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"

  hoobs:
    container_name: hoobs
    image: hoobs/hoobs
    volumes:
      - /home/pi/hoobs:/hoobs
    network_mode: host
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  homeassistant:
    container_name: home-assistant
    image: linuxserver/homeassistant:latest
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  adguardhome:
        container_name: adguardhome\
        restart: unless-stopped\
        volumes:
            - ${USERDIR}/adguardhome/work:/opt/adguardhome/work\
            - ${USERDIR}/adguardhome/conf:/opt/adguardhome/conf\
        ports:
            - 53:53/tcp
            - 53:53/udp\
            - 67:67/udp
            - 68:68/udp\
            - 80:80/tcp
            - 443:443/tcp
            - 443:443/udp
            - 3000:3000/tcp\
            - 853:853/tcp\
            - 784:784/udp
            - 853:853/udp
            - 8853:8853/udp\
            - 5443:5443/tcp
            - 5443:5443/udp\
        image: adguard/adguardhome
