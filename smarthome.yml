# Version of Docker compose file
version: "3"

# Apps
services:
  homebridge:
    image: oznu/homebridge:ubuntu
    container_name: homebridge
    restart: always
    network_mode: host
    environment:
      - HOMEBRIDGE_CONFIG_UI_PORT=8581
    ports:
      - 8581:8581
    volumes:
      - ${USERDIR}/homebridge:/homebridge
  hoobs:
    image: hoobs/hoobs
    container_name: hoobs
    restart: always
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${USERDIR}/hoobs:/hoobs
    ports:
      - 8080:8080
      - 8181:8181
      - 51826:51826
  adguardhome:
    container_name: adguard-home
    image: adguard/adguardhome
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 784:784/udp
      - 853:853/tcp
      - 3000:3000/tcp
      - 80:80/tcp
      - 443:443/tcp
    volumes:
      - ${USERDIR}/adguardhome/work:/opt/adguardhome/work
      - ${USERDIR}/adguardhome/conf:/opt/adguardhome/conf
    restart: unless-stopped
  homeassistant:
    container_name: home-assistant
    image: linuxserver/homeassistant:latest
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8123:8123
    volumes:
      - ${USERDIR}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
